<!DOCTYPE html>
<html lang="en">
<head>

<style>

          padding: 10px 18px; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; cursor: pointer;
          background: rgba(20, 28, 40, 0.78); color: #eef3f8; font: 600 14px system-ui, sans-serif; }

<body>
<div id="help" class="panel">
  <b>Left-click</b> raise land &nbsp;·&nbsp; <b>Right-click</b> lower land<br>
  <b>Drag</b> orbit &nbsp;·&nbsp; <b>Right-drag</b> pan &nbsp;·&nbsp; <b>Scroll</b> zoom<br>
  Flatten land to let settlements grow: hut → cottage → manor
</div>
<div id="hud" class="panel"></div>
<button id="mode" type="button">Click tool: Raise land</button>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('c');
const width = innerWidth, height = innerHeight;

// ==== WORLD START
// Everything below only uses: THREE, OrbitControls, canvas, width, height
// (plus the post-processing passes when they are available).
const HAS_POST = typeof GTAOPass !== 'undefined' && typeof OutputPass !== 'undefined';
const FULLSCREEN = canvas.id === 'c';

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const N = 48;            // simulation tiles per side
const V = N + 1;         // simulation vertices per side
const STEP = 0.6;        // world height of one terrain step
const SUB = 4;           // render subdivisions per tile
const R = N * SUB + 1;   // render vertices per side
const SEA = 0.16;        // water surface height
const HORIZON = 0xd6e9f2, ZENITH = 0x5f9fd8;
const SUN_DIR = new THREE.Vector3(-0.62, 0.55, 0.36).normalize();
const TRIBES = {
  blue: { roof: 0x44649f, flag: 0x2f6fe0, shirts: [0x2f5fc4, 0x3a74d8, 0x27498f, 0x4b7fc9] },
  red:  { roof: 0xa4432f, flag: 0xd8352a, shirts: [0xc43a2f, 0xd85a3a, 0x9e2a24, 0xb8483a] },

// ---------------------------------------------------------------------------
// Random numbers and noise (seeded, so the same world every time)
// ---------------------------------------------------------------------------
let seed = 1989;
function rnd() {

function hash2(x, z) {

  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);

}
function fbm(x, z, oct = 4) {

  for (let i = 0; i < oct; i++) { v += a * vnoise(x * f + i * 17.3, z * f - i * 9.1); norm += a; f *= 2.03; a *= 0.5; }
  return v / norm;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------------------
// Simulation heightmap: integer heights on tile corners, Populous slope rule
// ---------------------------------------------------------------------------
const h = new Int8Array(V * V);
{
  const feats = [];
  for (let i = 0; i < 4; i++) { const top = 8 + Math.floor(rnd() * 4); feats.push({ x: N * (0.2 + rnd() * 0.6), z: N * (0.2 + rnd() * 0.6), top, r: top + rnd() * 2 }); }
  for (let i = 0; i < 10; i++) feats.push({ x: N * (0.15 + rnd() * 0.7), z: N * (0.15 + rnd() * 0.7), top: 1 + Math.floor(rnd() * 3), r: 5 + rnd() * 7 });
  for (let z = 0; z < V; z++) for (let x = 0; x < V; x++) {
    let v = 0;
    for (const f of feats) v = Math.max(v, Math.min(f.top, f.r - Math.hypot(x - f.x, z - f.z)));
    v += (fbm(x * 0.15, z * 0.15) - 0.5) * 2.5;
    v = Math.min(v, (Math.min(x, z, N - x, N - z) - 3) * 0.8);
    h[z * V + x] = Math.max(0, Math.round(v));
  }
  for (let changed = true; changed;) {
    changed = false;
    for (let z = 0; z < V; z++) for (let x = 0; x < V; x++) for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, nz = z + dz;
      if (nx < 0 || nz < 0 || nx >= V || nz >= V) continue;
      if (h[z * V + x] > h[nz * V + nx] + 1) { h[z * V + x] = h[nz * V + nx] + 1; changed = true; }
    }
  }
}
// Raise (dir 1) or lower (dir -1) one corner and drag neighbours along to keep the slope rule.
function edit(x, z, dir) {
  const i0 = z * V + x;
  if ((dir > 0 && h[i0] >= 14) || (dir < 0 && h[i0] <= 0)) return false;
  h[i0] += dir;
  const q = [[x, z]];
  while (q.length) {
    const [cx, cz] = q.pop(), hv = h[cz * V + cx];
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      const nx = cx + dx, nz = cz + dz;
      if (nx < 0 || nz < 0 || nx >= V || nz >= V) continue;
      const i = nz * V + nx;
      if (dir > 0 && hv - h[i] > 1) { h[i] = hv - 1; q.push([nx, nz]); }
      if (dir < 0 && h[i] - hv > 1) { h[i] = hv + 1; q.push([nx, nz]); }
    }
  }
  return true;
}
const corners = (x, z) => [h[z * V + x], h[z * V + x + 1], h[(z + 1) * V + x], h[(z + 1) * V + x + 1]];
const inGrid = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
const isFlatLand = (x, z) => { if (!inGrid(x, z)) return false; const [a, b, c, d] = corners(x, z); return a === b && b === c && c === d && a >= 1; };
const tileCenter = (x, z) => [x - N / 2 + 0.5, z - N / 2 + 0.5];

// ---------------------------------------------------------------------------
// Renderer, camera, lights, post-processing
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(width, height);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(HORIZON);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 60, 170);
const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1200);
camera.position.set(14, 12, 21);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: 1.25, minDistance: 4, maxDistance: 75, screenSpacePanning: false });
controls.target.set(0, 1.2, 1);
if (FULLSCREEN) {
  const cam = new URLSearchParams(location.search).get('cam');
  if (cam) { const c = cam.split(',').map(Number); camera.position.set(c[0], c[1], c[2]); controls.target.set(c[3], c[4], c[5]); }
}

scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x5d6b3a, 1.1));
const sun = new THREE.DirectionalLight(0xffe4bd, 2.6);
sun.position.copy(SUN_DIR).multiplyScalar(90);
sun.castShadow = true;
sun.shadow.mapSize.set(HAS_POST ? 4096 : 2048, HAS_POST ? 4096 : 2048);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

let composer = null;
if (HAS_POST) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, width, height);
  try { gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.5, scale: 1.0 }); } catch (e) { /* older API */ }
  gtao.blendIntensity = 0.8;
  composer.addPass(gtao);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(width, height), 0.16, 0.45, 0.92));
  composer.addPass(new OutputPass());
}
if (FULLSCREEN) addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

const srgb = hex => new THREE.Vector3(((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255);
const GLSL_NOISE = `
  float hh(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hh(i), hh(i + vec2(1.0, 0.0)), u.x), mix(hh(i + vec2(0.0, 1.0)), hh(i + vec2(1.0, 1.0)), u.x), u.y); }
  float fb(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * vn(p); p = p * 2.03 + vec2(17.1, 9.7); a *= 0.5; } return v / 0.9375; }
`;

// ---------------------------------------------------------------------------
// Sky dome and clouds
// ---------------------------------------------------------------------------
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: srgb(ZENITH) }, horizon: { value: srgb(HORIZON) }, sunDir: { value: SUN_DIR } },
  vertexShader: `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top, horizon, sunDir; varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 col = mix(horizon, top, smoothstep(0.0, 0.45, d.y));
      float s = max(dot(d, sunDir), 0.0);
      col += vec3(1.0, 0.85, 0.6) * pow(s, 10.0) * 0.25 + vec3(1.0, 0.96, 0.85) * pow(s, 900.0) * 3.0;
      gl_FragColor = vec4(pow(col, vec3(2.2)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1;
scene.add(sky);

// ---------------------------------------------------------------------------
// Geometry helpers: build detailed props from coloured primitives
// ---------------------------------------------------------------------------
const _e = new THREE.Euler(), _mm = new THREE.Matrix4(), _qq = new THREE.Quaternion(), _vv = new THREE.Vector3(), _one = new THREE.Vector3(1, 1, 1);
function part(geo, hex, x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.deleteAttribute('uv');
  g.applyMatrix4(_mm.compose(_vv.set(x, y, z), _qq.setFromEuler(_e.set(rx, ry, rz)), _one));
  const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
function merge(parts) {

  for (const p of parts) n += p.attributes.position.count;
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let o = 0;
  for (const p of parts) {
    pos.set(p.attributes.position.array, o); nor.set(p.attributes.normal.array, o); col.set(p.attributes.color.array, o);
    o += p.attributes.position.count * 3;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
const Box = (w, hh, d) => new THREE.BoxGeometry(w, hh, d);
const Cyl = (rt, rb, hh, seg = 8) => new THREE.CylinderGeometry(rt, rb, hh, seg);
const Cone = (r, hh, seg = 8) => new THREE.ConeGeometry(r, hh, seg);
// Lumpy blob: vertices displaced by a position hash, so shared corners stay welded.
function blob(r, detail = 1, lump = 0.18) {
  const g = new THREE.IcosahedronGeometry(r, detail), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + (hash2(Math.round(x * 997), Math.round(y * 991 + z * 983)) - 0.5) * 2 * lump;
    p.setXYZ(i, x * k, y * k * 0.9, z * k);

  return g;
}
// Gable roof: ridge along X. Returns [slopes, gable ends].
function gable(w, d, rh) {
  const a = w / 2, b = d / 2;
  const s = new THREE.BufferGeometry(), e = new THREE.BufferGeometry();
  s.setAttribute('position', new THREE.Float32BufferAttribute([
    -a, 0, b, a, 0, b, a, rh, 0, -a, 0, b, a, rh, 0, -a, rh, 0,
    a, 0, -b, -a, 0, -b, -a, rh, 0, a, 0, -b, -a, rh, 0, a, rh, 0,
    // underside so the roof isn't see-through from below
    a, 0, b, -a, 0, b, -a, 0, -b, a, 0, b, -a, 0, -b, a, 0, -b,
  ], 3));
  e.setAttribute('position', new THREE.Float32BufferAttribute([a, 0, b, a, 0, -b, a, rh, 0, -a, 0, -b, -a, 0, b, -a, rh, 0], 3));

}

  const [s, e] = gable(w, d, rh);
  parts.push(part(s, roofHex, 0, y, 0), part(e, wallHex, 0, y - 0.001, 0));
  const ang = Math.atan2(rh, d / 2);
  for (const t of [0.3, 0.6]) for (const side of [1, -1]) // tile courses
    parts.push(part(Box(w + 0.01, 0.014, 0.03), trimHex, 0, y + rh * t + 0.008, side * (d / 2) * (1 - t), 0, side * -ang, 0));

}

  parts.push(part(Box(0.12, 0.018, 0.035), 0x5b3b24, x + g * 0.008, y - 0.058, z + f * 0.008, ry));
  parts.push(part(Box(0.11, 0.018, 0.028), 0x5b3b24, x, y + 0.058, z, ry));
  parts.push(part(Box(0.03, 0.1, 0.012), 0x4d6d3a, x - f * 0.062, y, z + g * 0.062, ry)); // shutters
  parts.push(part(Box(0.03, 0.1, 0.012), 0x4d6d3a, x + f * 0.062, y, z - g * 0.062, ry));

// ---------------------------------------------------------------------------
// Buildings (three tiers, per tribe, a few variants each)
// ---------------------------------------------------------------------------
const C = { stone: 0x8e8a80, stoneDark: 0x6c685f, stone2: 0xa19b8e, plaster: 0xeadcc0, timber: 0x5b3b24, thatch: 0xc49a52,
  thatchDark: 0xa27c3c, mud: 0xb99a6c, door: 0x6b4428, wood: 0x8a5a34 };
function hutGeo(tribe) {
  const P = [], T = TRIBES[tribe];
  P.push(part(Cyl(0.3, 0.33, 0.3, 14), C.stone, 0, -0.09, 0));
  P.push(part(Cyl(0.26, 0.27, 0.27, 14), C.mud, 0, 0.195, 0));
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2 + 0.3; P.push(part(Cyl(0.014, 0.016, 0.27, 5), C.timber, Math.cos(a) * 0.268, 0.195, Math.sin(a) * 0.268)); }
  P.push(part(Cone(0.39, 0.38, 14), C.thatch, 0, 0.52, 0));
  P.push(part(Cyl(0.392, 0.4, 0.035, 14), C.thatchDark, 0, 0.345, 0));
  P.push(part(Cone(0.05, 0.12, 6), C.timber, 0, 0.75, 0));
  P.push(part(Box(0.1, 0.17, 0.04), C.door, 0, 0.145, 0.262));
  for (const [x, y, z] of [[0.3, 0.085, 0.14], [0.3, 0.085, 0.09], [0.3, 0.125, 0.115]]) P.push(part(Cyl(0.024, 0.024, 0.16, 6), C.wood, x, y, z, 0, Math.PI / 2, 0));
  P.push(part(Cyl(0.01, 0.012, 0.6, 5), C.timber, -0.3, 0.36, 0.2));

function cottageGeo(tribe) {
  const P = [], T = TRIBES[tribe], W = 0.72, D = 0.52, WH = 0.4, B = 0.06;
  P.push(part(Box(W + 0.08, 0.36, D + 0.08), C.stone, 0, B - 0.18, 0));
  P.push(part(Box(W, WH, D), C.plaster, 0, B + WH / 2, 0));
  for (const x of [-W / 2, -W / 6, W / 6, W / 2]) for (const z of [D / 2, -D / 2]) P.push(part(Box(0.035, WH, 0.035), C.timber, x, B + WH / 2, z));
  for (const x of [-W / 2, W / 2]) P.push(part(Box(0.035, WH, 0.035), C.timber, x, B + WH / 2, 0));
  for (const z of [D / 2, -D / 2]) {
    P.push(part(Box(W + 0.03, 0.035, 0.035), C.timber, 0, B + WH - 0.018, z));
    P.push(part(Box(W + 0.03, 0.03, 0.03), C.timber, 0, B + 0.018, z));
  }
  for (const x of [-W / 2, W / 2]) P.push(part(Box(0.035, 0.035, D + 0.03), C.timber, x, B + WH - 0.018, 0));
  P.push(part(Box(0.022, 0.24, 0.02), C.timber, -W / 3, B + WH * 0.55, D / 2 + 0.005, 0, 0, 0.65));
  P.push(part(Box(0.022, 0.24, 0.02), C.timber, W / 3, B + WH * 0.55, -D / 2 - 0.005, 0, 0, -0.65));
  P.push(part(Box(0.12, 0.22, 0.03), C.door, 0.04, B + 0.11, D / 2 + 0.012));
  P.push(part(Box(0.16, 0.025, 0.06), C.stoneDark, 0.04, B + 0.235, D / 2 + 0.02));
  windowAt(P, -0.22, B + 0.25, D / 2 + 0.012, 0);
  windowAt(P, 0.24, B + 0.25, D / 2 + 0.012, 0);
  windowAt(P, 0.0, B + 0.25, -D / 2 - 0.012, Math.PI);
  windowAt(P, W / 2 + 0.012, B + 0.25, 0.0, Math.PI / 2);
  roof(P, W + 0.16, D + 0.18, 0.36, B + WH, T.roof, C.plaster, 0x2e3a52 + (tribe === 'red' ? 0x3a0000 : 0));
  const cx = W / 2 - 0.13, cz = -0.12;
  P.push(part(Box(0.11, 0.42, 0.11), C.stone, cx, B + WH + 0.2, cz));
  P.push(part(Box(0.14, 0.035, 0.14), C.stoneDark, cx, B + WH + 0.42, cz));
  P.push(part(Cyl(0.045, 0.045, 0.1, 8), C.wood, W / 2 + 0.07, B + 0.05 - 0.06, D / 2 - 0.06));
  P.push(part(Cyl(0.047, 0.047, 0.012, 8), 0x3a2a1a, W / 2 + 0.07, B + 0.02, D / 2 - 0.06));
  P.push(part(Box(0.2, 0.03, 0.06), C.wood, -0.2, B + 0.06 - 0.06 + 0.04, D / 2 + 0.08));
  return { geo: merge(P), chimney: new THREE.Vector3(cx, B + WH + 0.46, cz) };
}
function manorGeo(tribe) {

    const count = (tribe) => ({ v: villagers.filter(v => v.userData.tribe === tribe).length, b: [...buildings.values()].filter(b => b.tribe === tribe) });
    const B = count('blue'), Rd = count('red');
    const tiers = bs => ['huts', 'cottages', 'manors'].map((n, i) => `${bs.filter(b => b.tier === i + 1).length} ${n}`).join(' · ');
    hud.innerHTML = `<span class="blue">Blue tribe</span>: ${B.v} walkers<br>${tiers(B.b)}<br><span class="red">Red tribe</span>: ${Rd.v} walkers<br>${tiers(Rd.b)}`;
  }

  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
}
animate();
// ==== WORLD END
</script>
</body>
</html>
